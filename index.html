<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Images Minimalista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-in': 'slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1)',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(5px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideIn: {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .drop-zone-active {
            @apply border-blue-400 bg-blue-50 transform scale-[1.01];
        }
    </style>
</head>
<body class="font-sans bg-gray-50 text-gray-900 min-h-screen p-4 sm:p-6 antialiased">
    <div class="max-w-3xl mx-auto py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                Pega imágenes
            </h1>
            <p class="text-gray-500 text-base">
                Pega o arrastra imágenes para guardarlas y descargarlas.
            </p>
            <div class="mt-4 flex justify-center">
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="autoDownloadCheckbox" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2" checked>
                    <span class="ml-2 text-sm font-medium text-gray-700">Descargar automáticamente al pegar</span>
                </label>
            </div>
        </header>

        <div id="dropZone" 
             class="bg-white border-2 border-dashed border-gray-200 rounded-lg p-10 text-center transition-all duration-200 cursor-pointer mb-8
                    hover:border-blue-300 hover:bg-blue-50
                    focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-gray-50" 
             tabindex="0"
             aria-label="Zona para pegar o arrastrar imágenes"
             aria-describedby="dropZoneDescription">
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white text-xl mb-4 shadow-md">
                    📋
                </div>
                <div class="text-lg font-medium text-gray-700 mb-1">
                    Pega tu imagen aquí
                </div>
                <div id="dropZoneDescription" class="text-sm text-gray-400">
                    Ctrl+V o arrastra una imagen.
                </div>
            </div>
        </div>

        <section class="bg-white rounded-lg p-6 shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-semibold text-gray-800">
                    Historial
                </h2>
                <button id="clearBtn" 
                        class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-gray-500 bg-transparent border border-gray-200 rounded-md
                               transition-all duration-200 hover:border-red-400 hover:text-red-600 hover:bg-red-50
                               disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:border-gray-200 disabled:hover:text-gray-500 disabled:hover:bg-transparent
                               focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2 focus:ring-offset-gray-50" 
                        disabled>
                    <span class="text-red-500">🗑</span>
                    Limpiar
                </button>
            </div>
            
            <div id="historyGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <div class="col-span-full text-center py-8 text-gray-400">
                    <div class="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
                        🖼️
                    </div>
                    <p>No hay imágenes guardadas</p>
                </div>
            </div>
        </section>
    </div>

    <div id="toast" 
         class="fixed top-4 right-4 bg-white border rounded-lg p-3 shadow-lg transform translate-x-full transition-transform duration-300 z-50 flex items-center gap-3 max-w-xs sm:max-w-sm text-sm"
         role="alert"
         aria-live="polite">
        <span id="toastIcon" class="text-base"></span>
        <span id="toastMessage" class="font-medium"></span>
    </div>

    <!-- Image Editor Modal -->
    <div id="editorModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden" 
         style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); align-items: center; justify-content: center; z-index: 50;">
        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] flex flex-col" 
             style="background-color: white; border-radius: 8px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); max-width: 56rem; width: 100%; margin: 0 1rem; max-height: 90vh; display: flex; flex-direction: column;">
            <div class="flex justify-between items-center p-4 border-b border-gray-200" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #e5e7eb;">
                <h3 class="text-lg font-semibold text-gray-800" style="font-size: 1.125rem; font-weight: 600; color: #1f2937;">Editar Imagen</h3>
                <button id="closeEditorBtn" class="text-gray-500 hover:text-gray-700 text-2xl font-bold w-8 h-8 flex items-center justify-center" 
                        style="color: #6b7280; font-size: 1.5rem; font-weight: bold; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; background: none; border: none;">
                    ×
                </button>
            </div>
            <div class="p-4 flex gap-2 border-b border-gray-200 bg-gray-50" style="padding: 1rem; display: flex; gap: 0.5rem; border-bottom: 1px solid #e5e7eb; background-color: #f9fafb;">
                <button id="cropModeBtn" class="px-4 py-2 bg-blue-500 text-white text-sm font-medium rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400" 
                        style="padding: 0.5rem 1rem; background-color: #3b82f6; color: white; font-size: 0.875rem; font-weight: 500; border-radius: 0.375rem; border: none; cursor: pointer;">
                    ✂️ Recortar
                </button>
                <button id="drawModeBtn" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400" 
                        style="padding: 0.5rem 1rem; background-color: #e5e7eb; color: #374151; font-size: 0.875rem; font-weight: 500; border-radius: 0.375rem; border: none; cursor: pointer;">
                    ✏️ Dibujar
                </button>
                <div class="flex-1" style="flex: 1;"></div>
                <button id="saveEditBtn" class="px-4 py-2 bg-green-500 text-white text-sm font-medium rounded-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400" 
                        style="padding: 0.5rem 1rem; background-color: #10b981; color: white; font-size: 0.875rem; font-weight: 500; border-radius: 0.375rem; border: none; cursor: pointer;">
                    💾 Guardar
                </button>
            </div>
            <!-- Draw Controls -->
            <div id="drawControls" class="p-4 flex gap-2 border-b border-gray-200 bg-gray-50 hidden" style="display: none; padding: 1rem; gap: 0.5rem; border-bottom: 1px solid #e5e7eb; background-color: #f9fafb;">
                <label class="flex items-center gap-2" style="display: flex; align-items: center; gap: 0.5rem;">
                    <span class="text-sm text-gray-700" style="font-size: 0.875rem; color: #374151;">Color:</span>
                    <input type="color" id="drawColor" value="#ff0000" class="w-10 h-8 rounded cursor-pointer" style="width: 2.5rem; height: 2rem; border-radius: 0.25rem; cursor: pointer;">
                </label>
                <label class="flex items-center gap-2" style="display: flex; align-items: center; gap: 0.5rem;">
                    <span class="text-sm text-gray-700" style="font-size: 0.875rem; color: #374151;">Grosor:</span>
                    <input type="range" id="drawWidth" min="1" max="20" value="3" class="w-32" style="width: 8rem;">
                    <span id="drawWidthValue" class="text-sm text-gray-700 w-6" style="font-size: 0.875rem; color: #374151; width: 1.5rem;">3</span>
                </label>
                <button id="clearDrawBtn" class="px-3 py-1 bg-red-500 text-white text-sm font-medium rounded-md hover:bg-red-600" 
                        style="padding: 0.25rem 0.75rem; background-color: #ef4444; color: white; font-size: 0.875rem; font-weight: 500; border-radius: 0.375rem; border: none; cursor: pointer;">
                    🗑️ Limpiar
                </button>
            </div>
            <div class="flex-1 overflow-auto p-4 bg-gray-100" style="flex: 1; overflow: auto; padding: 1rem; background-color: #f3f4f6;">
                <div id="canvasContainer" class="relative inline-block mx-auto" style="position: relative; display: inline-block; margin: 0 auto;">
                    <canvas id="editorCanvas" class="border border-gray-300 bg-white max-w-full" style="border: 1px solid #d1d5db; background-color: white; max-width: 100%;"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        class ClipboardImageManager {
            constructor() {
                this.history = JSON.parse(localStorage.getItem('clipboardImages') || '[]');
                this.maxHistory = 10;
                this.autoDownload = localStorage.getItem('autoDownload') !== 'false';
                this.editorMode = 'crop'; // 'crop' or 'draw'
                this.currentImage = null;
                this.cropSelection = null;
                this.isDrawing = false;
                this.drawingHistory = [];
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.render();
                this.updateCheckboxState();
            }

            setupEventListeners() {
                const dropZone = document.getElementById('dropZone');
                const clearBtn = document.getElementById('clearBtn');
                const autoDownloadCheckbox = document.getElementById('autoDownloadCheckbox');

                document.addEventListener('paste', (e) => this.handlePaste(e));
                
                dropZone.addEventListener('click', () => dropZone.focus());
                dropZone.addEventListener('dragover', this.handleDragOver.bind(this));
                dropZone.addEventListener('dragleave', this.handleDragLeave.bind(this));
                dropZone.addEventListener('drop', this.handleDrop.bind(this));

                clearBtn.addEventListener('click', this.clearHistory.bind(this));
                autoDownloadCheckbox.addEventListener('change', this.handleAutoDownloadChange.bind(this));

                // Editor modal event listeners
                document.getElementById('closeEditorBtn').addEventListener('click', () => this.closeEditor());
                document.getElementById('cropModeBtn').addEventListener('click', () => this.switchMode('crop'));
                document.getElementById('drawModeBtn').addEventListener('click', () => this.switchMode('draw'));
                document.getElementById('saveEditBtn').addEventListener('click', () => this.saveEditedImage());
                
                // Draw controls
                document.getElementById('drawWidth').addEventListener('input', (e) => {
                    document.getElementById('drawWidthValue').textContent = e.target.value;
                });
                document.getElementById('clearDrawBtn').addEventListener('click', () => this.clearDrawing());

                document.addEventListener('dragover', (e) => e.preventDefault());
                document.addEventListener('drop', (e) => e.preventDefault());
            }

            updateCheckboxState() {
                const checkbox = document.getElementById('autoDownloadCheckbox');
                checkbox.checked = this.autoDownload;
            }

            handleAutoDownloadChange(e) {
                this.autoDownload = e.target.checked;
                localStorage.setItem('autoDownload', this.autoDownload);
                this.showToast(
                    this.autoDownload ? 'Descarga automática activada' : 'Descarga automática desactivada',
                    'success',
                    '⚙️'
                );
            }

            handleDragOver(e) {
                e.preventDefault();
                e.currentTarget.classList.add('drop-zone-active');
            }

            handleDragLeave(e) {
                e.currentTarget.classList.remove('drop-zone-active');
            }

            async handleDrop(e) {
                e.preventDefault();
                e.currentTarget.classList.remove('drop-zone-active');
                
                const files = Array.from(e.dataTransfer.files);
                const imageFile = files.find(file => file.type.startsWith('image/'));
                
                if (imageFile) {
                    await this.processImage(imageFile);
                } else {
                    this.showToast('Solo se aceptan imágenes', 'error', '❌');
                }
            }

            async handlePaste(e) {
                const items = Array.from(e.clipboardData.items);
                const imageItem = items.find(item => item.type.startsWith('image/'));
                
                if (imageItem) {
                    const file = imageItem.getAsFile();
                    await this.processImage(file);
                } else {
                    if (e.clipboardData.getData('text/plain') || e.clipboardData.files.length > 0) {
                        this.showToast('Lo pegado no es una imagen', 'error', '❌');
                    }
                }
            }

            async processImage(file) {
                try {
                    const imageData = await this.fileToDataURL(file);
                    const imageInfo = {
                        id: Date.now(),
                        data: imageData,
                        name: `imagen_${new Date().toISOString().slice(0, 19).replace(/[:.]/g, '-')}.${this.getExtension(file.type)}`,
                        timestamp: new Date().toLocaleString('es-ES', {
                            day: '2-digit',
                            month: '2-digit',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        }),
                        type: file.type
                    };

                    this.addToHistory(imageInfo);
                    
                    if (this.autoDownload) {
                        this.downloadImage(imageInfo);
                        this.showToast('Imagen descargada con éxito', 'success', '✅');
                    } else {
                        this.openEditor(imageInfo);
                        this.showToast('Imagen agregada. Edítala antes de descargar', 'success', '✅');
                    }
                } catch (error) {
                    console.error('Error al procesar la imagen:', error);
                    this.showToast('Error al procesar la imagen', 'error', '❌');
                }
            }

            fileToDataURL(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = (error) => reject(error);
                    reader.readAsDataURL(file);
                });
            }

            getExtension(mimeType) {
                const extensions = {
                    'image/jpeg': 'jpg',
                    'image/png': 'png',
                    'image/gif': 'gif',
                    'image/webp': 'webp',
                    'image/bmp': 'bmp',
                    'image/tiff': 'tiff'
                };
                return extensions[mimeType] || 'png';
            }

            addToHistory(imageInfo) {
                this.history.unshift(imageInfo);
                if (this.history.length > this.maxHistory) {
                    this.history = this.history.slice(0, this.maxHistory);
                }
                this.saveHistory();
                this.render();
            }

            saveHistory() {
                localStorage.setItem('clipboardImages', JSON.stringify(this.history));
            }

            render() {
                this.renderHistory();
                this.updateClearButton();
            }

            renderHistory() {
                const grid = document.getElementById('historyGrid');
                
                if (this.history.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-8 text-gray-400">
                            <div class="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
                                🖼️
                            </div>
                            <p>No hay imágenes guardadas</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = this.history.map(item => `
                    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden transition-all duration-200 
                                hover:shadow-md hover:border-gray-300 transform hover:-translate-y-0.5 animate-fade-in group flex flex-col">
                        <div class="aspect-square overflow-hidden bg-gray-50 flex-shrink-0">
                            <img src="${item.data}" 
                                 alt="Imagen capturada" 
                                 class="w-full h-full object-cover transition-transform duration-200 group-hover:scale-105" 
                                 loading="lazy">
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-grow">
                            <div class="text-xs text-gray-400 mb-2">
                                ${item.timestamp}
                            </div>
                            <div class="flex gap-2 mt-auto">
                                <button onclick="manager.downloadImage(${this.escapeJson(item)})"
                                        title="Descargar imagen"
                                        class="flex-1 flex items-center justify-center gap-1 px-2 py-1.5 bg-blue-500 text-white text-xs font-medium rounded-md 
                                               transition-all duration-200 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-white">
                                    ⬇ Descargar
                                </button>
                                <button onclick="manager.deleteImage(${item.id})"
                                        title="Eliminar imagen"
                                        class="px-2 py-1.5 bg-gray-100 text-gray-600 text-xs font-medium rounded-md 
                                               transition-all duration-200 hover:bg-red-100 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2 focus:ring-offset-white">
                                    🗑
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            escapeJson(obj) {
                return JSON.stringify(obj).replace(/'/g, '&apos;').replace(/"/g, '&quot;');
            }

            downloadImage(imageInfo) {
                const link = document.createElement('a');
                link.href = imageInfo.data;
                link.download = imageInfo.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            deleteImage(id) {
                this.history = this.history.filter(item => item.id !== id);
                this.saveHistory();
                this.render();
                this.showToast('Imagen eliminada', 'success', '🗑️');
            }

            clearHistory() {
                if (this.history.length === 0) return;
                
                if (confirm('¿Estás seguro de que quieres eliminar todas las imágenes del historial?')) {
                    this.history = [];
                    this.saveHistory();
                    this.render();
                    this.showToast('Historial limpiado', 'success', '✨');
                }
            }

            updateClearButton() {
                const clearBtn = document.getElementById('clearBtn');
                clearBtn.disabled = this.history.length === 0;
            }

            showToast(message, type = 'error', icon = '') {
                const toast = document.getElementById('toast');
                const iconEl = document.getElementById('toastIcon');
                const messageEl = document.getElementById('toastMessage');
                
                iconEl.textContent = icon;
                messageEl.textContent = message;
                
                toast.className = 'fixed top-4 right-4 bg-white border rounded-lg p-3 shadow-lg transform translate-x-full transition-transform duration-300 z-50 flex items-center gap-3 max-w-xs sm:max-w-sm text-sm';
                
                if (type === 'success') {
                    toast.classList.add('border-green-200', 'bg-green-50');
                    messageEl.classList.add('text-green-700');
                    iconEl.classList.add('text-green-500');
                } else {
                    toast.classList.add('border-red-200', 'bg-red-50');
                    messageEl.classList.add('text-red-700');
                    iconEl.classList.add('text-red-500');
                }
                
                toast.classList.remove('translate-x-full');
                toast.classList.add('translate-x-0', 'animate-slide-in');

                setTimeout(() => {
                    toast.classList.remove('translate-x-0', 'animate-slide-in');
                    toast.classList.add('translate-x-full');
                }, 3000);
            }

            openEditor(imageInfo) {
                this.currentImage = imageInfo;
                const modal = document.getElementById('editorModal');
                const canvas = document.getElementById('editorCanvas');
                const ctx = canvas.getContext('2d');
                
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    this.originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    this.setupCanvasInteraction();
                };
                img.src = imageInfo.data;
                
                modal.classList.remove('hidden');
                modal.style.display = 'flex';
                this.switchMode('crop');
            }

            closeEditor() {
                const modal = document.getElementById('editorModal');
                modal.classList.add('hidden');
                modal.style.display = 'none';
                this.currentImage = null;
                this.cropSelection = null;
                this.isDrawing = false;
                this.drawingHistory = [];
            }

            switchMode(mode) {
                this.editorMode = mode;
                const cropBtn = document.getElementById('cropModeBtn');
                const drawBtn = document.getElementById('drawModeBtn');
                const drawControls = document.getElementById('drawControls');
                const canvas = document.getElementById('editorCanvas');
                
                if (mode === 'crop') {
                    cropBtn.className = 'px-4 py-2 bg-blue-500 text-white text-sm font-medium rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400';
                    drawBtn.className = 'px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400';
                    drawControls.classList.add('hidden');
                    drawControls.style.display = 'none';
                    canvas.style.cursor = 'crosshair';
                    cropBtn.style.backgroundColor = '#3b82f6';
                    cropBtn.style.color = 'white';
                    drawBtn.style.backgroundColor = '#e5e7eb';
                    drawBtn.style.color = '#374151';
                } else {
                    drawBtn.className = 'px-4 py-2 bg-blue-500 text-white text-sm font-medium rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400';
                    cropBtn.className = 'px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400';
                    drawControls.classList.remove('hidden');
                    drawControls.style.display = 'flex';
                    canvas.style.cursor = 'default';
                    drawBtn.style.backgroundColor = '#3b82f6';
                    drawBtn.style.color = 'white';
                    cropBtn.style.backgroundColor = '#e5e7eb';
                    cropBtn.style.color = '#374151';
                }
                
                this.setupCanvasInteraction();
            }

            setupCanvasInteraction() {
                const canvas = document.getElementById('editorCanvas');
                const ctx = canvas.getContext('2d');
                
                // Remove old listeners by cloning and replacing
                const newCanvas = canvas.cloneNode(true);
                canvas.parentNode.replaceChild(newCanvas, canvas);
                
                if (this.editorMode === 'crop') {
                    this.setupCropInteraction(newCanvas, ctx);
                } else {
                    this.setupDrawInteraction(newCanvas, ctx);
                }
            }

            setupCropInteraction(canvas, ctx) {
                let startX, startY, isSelecting = false;
                
                canvas.addEventListener('mousedown', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    startX = e.clientX - rect.left;
                    startY = e.clientY - rect.top;
                    isSelecting = true;
                    this.cropSelection = { startX, startY, width: 0, height: 0 };
                });
                
                canvas.addEventListener('mousemove', (e) => {
                    if (!isSelecting) return;
                    
                    const rect = canvas.getBoundingClientRect();
                    const currentX = e.clientX - rect.left;
                    const currentY = e.clientY - rect.top;
                    
                    const width = currentX - startX;
                    const height = currentY - startY;
                    
                    this.cropSelection = { startX, startY, width, height };
                    
                    // Redraw image and selection
                    ctx.putImageData(this.originalImageData, 0, 0);
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(startX, startY, width, height);
                    ctx.fillStyle = 'rgba(59, 130, 246, 0.1)';
                    ctx.fillRect(startX, startY, width, height);
                    ctx.setLineDash([]);
                });
                
                canvas.addEventListener('mouseup', () => {
                    isSelecting = false;
                });
            }

            setupDrawInteraction(canvas, ctx) {
                let isDrawing = false;
                let lastX = 0;
                let lastY = 0;
                
                canvas.addEventListener('mousedown', (e) => {
                    isDrawing = true;
                    const rect = canvas.getBoundingClientRect();
                    lastX = e.clientX - rect.left;
                    lastY = e.clientY - rect.top;
                });
                
                canvas.addEventListener('mousemove', (e) => {
                    if (!isDrawing) return;
                    
                    const rect = canvas.getBoundingClientRect();
                    const currentX = e.clientX - rect.left;
                    const currentY = e.clientY - rect.top;
                    
                    const color = document.getElementById('drawColor').value;
                    const width = document.getElementById('drawWidth').value;
                    
                    ctx.strokeStyle = color;
                    ctx.lineWidth = width;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(currentX, currentY);
                    ctx.stroke();
                    
                    lastX = currentX;
                    lastY = currentY;
                });
                
                canvas.addEventListener('mouseup', () => {
                    isDrawing = false;
                    // Save current state
                    this.originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                });
                
                canvas.addEventListener('mouseleave', () => {
                    isDrawing = false;
                });
            }

            clearDrawing() {
                const canvas = document.getElementById('editorCanvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    this.originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                };
                img.src = this.currentImage.data;
            }

            saveEditedImage() {
                const canvas = document.getElementById('editorCanvas');
                const ctx = canvas.getContext('2d');
                
                let finalCanvas = canvas;
                
                // If crop mode and selection exists, create cropped canvas
                if (this.editorMode === 'crop' && this.cropSelection && 
                    this.cropSelection.width !== 0 && this.cropSelection.height !== 0) {
                    finalCanvas = document.createElement('canvas');
                    const finalCtx = finalCanvas.getContext('2d');
                    
                    const x = Math.min(this.cropSelection.startX, this.cropSelection.startX + this.cropSelection.width);
                    const y = Math.min(this.cropSelection.startY, this.cropSelection.startY + this.cropSelection.height);
                    const width = Math.abs(this.cropSelection.width);
                    const height = Math.abs(this.cropSelection.height);
                    
                    finalCanvas.width = width;
                    finalCanvas.height = height;
                    
                    finalCtx.drawImage(canvas, x, y, width, height, 0, 0, width, height);
                }
                
                const editedImageData = finalCanvas.toDataURL(this.currentImage.type);
                const editedImageInfo = {
                    ...this.currentImage,
                    id: Date.now(),
                    data: editedImageData,
                    name: `editada_${this.currentImage.name}`
                };
                
                this.addToHistory(editedImageInfo);
                this.downloadImage(editedImageInfo);
                this.showToast('Imagen editada y descargada', 'success', '✅');
                this.closeEditor();
            }
        }

        const manager = new ClipboardImageManager();
    </script>
